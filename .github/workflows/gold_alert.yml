name: Gold Rate Alert — Pune

on:
  schedule:
    # Backup schedule — every 30 minutes: 9:00 AM – 8:00 PM IST (UTC+5:30)
    # Primary trigger is cron-job.org via repository_dispatch
    - cron: "30 3 * * *"        # 3:30 UTC  → 9:00 AM IST
    - cron: "0,30 4-13 * * *"   # Every 30 min → 9:30 AM – 7:30 PM IST
    - cron: "0,30 14 * * *"     # 14:00, 14:30 UTC → 7:30, 8:00 PM IST

  workflow_dispatch:

  # External trigger from cron-job.org (primary, reliable scheduler)
  repository_dispatch:
    types: [cron-trigger]

jobs:
  check-gold-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Pune gold rate and send alerts
        env:
          THRESHOLD_22K: ${{ secrets.THRESHOLD_22K }}
          THRESHOLD_24K: ${{ secrets.THRESHOLD_24K }}
          GRAMS_22K:     ${{ secrets.GRAMS_22K }}
          GRAMS_24K:     ${{ secrets.GRAMS_24K }}
          BUDGET_22K:    ${{ secrets.BUDGET_22K }}
          BUDGET_24K:    ${{ secrets.BUDGET_24K }}
          ALERT_NUMBERS:  ${{ secrets.ALERT_NUMBERS }}
          ALERT_API_KEYS: ${{ secrets.ALERT_API_KEYS }}
          HEALTH_NUMBER:  ${{ secrets.HEALTH_NUMBER }}
          HEALTH_API_KEY: ${{ secrets.HEALTH_API_KEY }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          HEALTH_EMAIL: ${{ secrets.HEALTH_EMAIL }}
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DAILY_HEALTH_CHECK: ${{ secrets.DAILY_HEALTH_CHECK }}

        run: python src/gold_alert.py

      - name: Upload last check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-check-${{ github.run_number }}
          path: last_check.json
          retention-days: 7